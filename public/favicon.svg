<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="45%" stop-color="#1e1b4b"/>
      <stop offset="75%" stop-color="#3b0764"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <!-- Background Squircle -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="124" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="6"/>
  
  <!-- Outer Glow Ring -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="url(#glowGrad)" stroke-width="12" stroke-dasharray="16 12" opacity="0.6" />
  
  <!-- Stylized Nova N Symbol -->
  <g filter="url(#neonGlow)">
    <path d="M168 352 V160 L344 352 V160" fill="none" stroke="url(#glowGrad)" stroke-width="36" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="168" cy="160" r="20" fill="#06b6d4" />
    <circle cx="344" cy="352" r="20" fill="#a855f7" />
    <circle cx="256" cy="256" r="14" fill="#ffffff" />
  </g>
</svg>
